name: Keep databases alive

# Supabase free projects pause after ~1 week of inactivity, and Render free
# services spin down. These endpoints run a real DB query, which counts as activity.
on:
  schedule:
    - cron: "0 7 * * 1,4" # Mondays and Thursdays, 07:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: MediClear (Supabase vknbj...)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 "https://interface-4d0c.onrender.com/users/check-username/keepalive"

      - name: Recipes (Supabase qafrv...)
        run: curl --fail --silent --show-error --retry 5 --retry-delay 30 --retry-all-errors --max-time 120 "https://vue-recipes-project.onrender.com/check-username?username=keepalive"

      - name: HR Battalion (Supabase otvdd...)
        env:
          HR_SUPABASE_URL: ${{ secrets.HR_SUPABASE_URL }}
          HR_SUPABASE_KEY: ${{ secrets.HR_SUPABASE_KEY }}
        run: |
          # Without the secrets this step is skipped (shows as a notice, not a failure).
          # To enable it, add repo secrets HR_SUPABASE_URL and HR_SUPABASE_KEY.
          if [ -z "$HR_SUPABASE_URL" ] || [ -z "$HR_SUPABASE_KEY" ]; then
            echo "::notice::HR Battalion ping skipped: repo secrets HR_SUPABASE_URL / HR_SUPABASE_KEY are not set"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 \
            "$HR_SUPABASE_URL/rest/v1/battalions?select=id&limit=1" \
            -H "apikey: $HR_SUPABASE_KEY" -o /dev/null
