<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OG image source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #05070c; }
    body { position: relative; font-family: "Space Grotesk", system-ui, sans-serif; color: #e9edf5; -webkit-font-smoothing: antialiased; }

    .bg { position: absolute; inset: 0; }
    .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
    .b1 { width: 620px; height: 620px; left: -160px; top: -200px; background: rgba(94, 234, 212, 0.26); }
    .b2 { width: 560px; height: 560px; right: -80px; top: -120px; background: rgba(129, 140, 248, 0.34); }
    .b3 { width: 520px; height: 520px; left: 360px; bottom: -300px; background: rgba(240, 171, 252, 0.20); }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 40%, #000 25%, transparent 80%);
    }

    .person {
      position: absolute; right: 70px; bottom: 0; width: 478px; height: 600px;
      -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
    }
    .person img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

    .copy { position: absolute; left: 76px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; }
    .pill { display: inline-flex; align-items: center; gap: 12px; align-self: flex-start; padding: 10px 18px; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; background: rgba(255,255,255,.05); font: 500 17px "JetBrains Mono", monospace; color: rgba(233,237,245,.85); }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #5eead4; box-shadow: 0 0 0 6px rgba(94,234,212,.18); }
    h1 { margin-top: 34px; font-size: 138px; line-height: .9; font-weight: 600; letter-spacing: -3px; }
    h1 .grad { display: inline-block; background: linear-gradient(100deg, #5eead4, #818cf8 55%, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
    .role { margin-top: 34px; font: 500 22px "JetBrains Mono", monospace; letter-spacing: 3.5px; text-transform: uppercase; color: #5eead4; }
    .tags { margin-top: 18px; font-size: 30px; font-weight: 500; color: rgba(233,237,245,.78); }
  </style>
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div>
  </div>
  <div class="person"><img src="/img/oded-cutout.png" alt="" /></div>
  <div class="copy">
    <div class="pill"><span class="dot"></span>Open to work</div>
    <h1>Oded<br /><span class="grad">Atias</span></h1>
    <div class="role">AI-oriented Software Engineer</div>
    <div class="tags">AI · Data · Full-stack</div>
  </div>
</body>
</html>
